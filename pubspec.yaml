name: tele_cinema
description: مشغل أفلام احترافي لقنوات تليجرام العامة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  cached_network_image: ^3.3.0
  video_player: ^2.8.1
  volume_controller: ^2.0.7
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/iconic.png

dependency_overrides:
  package_info_plus: 8.0.2
  wakelock_plus: 1.2.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/iconic.png"
  adaptive_icon_background: "#090d16"
  adaptive_icon_foreground: "assets/iconic.png"
