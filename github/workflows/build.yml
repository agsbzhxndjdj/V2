on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3

      - name: توليد ملفات Android الناقصة
        run: flutter create . --platforms android

      - uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: debug-keystore-v1

      - name: مفتاح توقيع ثابت + طباعة SHA1
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -keystore android.app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || \
            keytool -genkeypair -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore android/app/debug.keystore -storepass android | grep SHA1 || true

      - name: ربط خدمات قوقل + اسم التطبيق
        run: |
          sed -i '/^plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/build.gradle
          sed -i '/^plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          sed -i 's/android:label="tele_cinema"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml

      - name: البناء
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: ربط خدمات قوقل + اسم التطبيق
        run: |
          sed -i '/^plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/build.gradle
          sed -i '/^plugins {/a\    id "com.google.gms.google-services"' android/app/build.gradle
          sed -i 's/android:label="tele_cinema"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml

      - name: البناء
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
