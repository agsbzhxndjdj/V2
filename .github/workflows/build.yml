name: Build Phone + TV + iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate android folder
        run: flutter create . --platforms android --no-overwrite

      - name: Patch AndroidManifest (HTTP + app name)
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml

      - name: Build Phone APK
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons:main
          flutter build apk --release

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-phone
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Patch manifest for Android TV
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />|' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="تلي سينما"/android:label="تلي سينما TV"/' android/app/src/main/AndroidManifest.xml

      - name: Build TV APK
        run: flutter build apk --release

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-tv
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate iOS folder
        run: flutter create . --platforms ios --no-overwrite

      - name: Allow HTTP in Info.plist (ATS)
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist 2>/dev/null || true

      - name: Build iOS (without signing)
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r tele-cinema-ios-unsigned.zip Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-ios-unsigned
          path: build/ios/iphoneos/tele-cinema-ios-unsigned.zip
