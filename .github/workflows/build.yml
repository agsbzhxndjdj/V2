name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Create missing files
        run: |
          echo "=== Creating missing files ==="
          
          # 1. site_movie.dart
          if [ ! -f "lib/models/site_movie.dart" ]; then
            mkdir -p lib/models
            cat > lib/models/site_movie.dart << 'DART_EOF'
          class SiteMovie {
            final String id;
            final String title;
            final String year;
            final String site;
            final String videoUrl;
            final String poster;
            final String backdrop;
            final String overview;
            final double rating;
            final String duration;
            final List<String> genres;
            final List<VideoQuality> qualities;
            final bool hasSubtitle;
            final String? subtitleLang;
            final int? tmdbId;

            SiteMovie({
              required this.id,
              required this.title,
              required this.year,
              required this.site,
              required this.videoUrl,
              this.poster = '',
              this.backdrop = '',
              this.overview = '',
              this.rating = 0,
              this.duration = '',
              this.genres = const [],
              this.qualities = const [],
              this.hasSubtitle = false,
              this.subtitleLang,
              this.tmdbId,
            });

            bool get isMultiQuality => qualities.length > 1;

            String get qualityLabel {
              if (qualities.isEmpty) return '';
              if (isMultiQuality) return 'متعدد الجودات';
              return qualities.first.label;
            }

            String get subtitleLabel => hasSubtitle ? 'مترجم' : 'بدون ترجمة';

            String get siteName {
              switch (site) {
                case 'plex': return 'Plex';
                case 'roku': return 'Roku';
                case 'crackle': return 'Crackle';
                default: return site;
              }
            }

            SiteMovie copyWith({
              String? poster,
              String? backdrop,
              String? overview,
              double? rating,
              List<String>? genres,
              bool? hasSubtitle,
              String? subtitleLang,
              int? tmdbId,
            }) {
              return SiteMovie(
                id: id, title: title, year: year, site: site,
                videoUrl: videoUrl,
                poster: poster ?? this.poster,
                backdrop: backdrop ?? this.backdrop,
                overview: overview ?? this.overview,
                rating: rating ?? this.rating,
                duration: duration,
                genres: genres ?? this.genres,
                qualities: qualities,
                hasSubtitle: hasSubtitle ?? this.hasSubtitle,
                subtitleLang: subtitleLang ?? this.subtitleLang,
                tmdbId: tmdbId ?? this.tmdbId,
              );
            }
          }

          class VideoQuality {
            final String label;
            final String url;
            final int bandwidth;
            VideoQuality({required this.label, required this.url, this.bandwidth = 0});
          }
          DART_EOF
            echo "✅ Created site_movie.dart"
          fi
          
          # 2. tmdb_service.dart
          if [ ! -f "lib/services/tmdb_service.dart" ]; then
            cat > lib/services/tmdb_service.dart << 'DART_EOF'
          import 'package:dio/dio.dart';
          import '../models/site_movie.dart';

          class TmdbService {
            static const String _apiKey = '9ba4e29354937364c2202857afcd7f94';
            static const String _baseUrl = 'https://api.themoviedb.org/3';
            static const String _imageBase = 'https://image.tmdb.org/t/p';
            static final Dio _dio = Dio(BaseOptions(
              connectTimeout: const Duration(seconds: 10),
              receiveTimeout: const Duration(seconds: 15),
            ));

            static Future<SiteMovie?> enrichMovie(SiteMovie movie) async {
              try {
                final cleanTitle = movie.title.replaceAll(RegExp(r'(19|20)\d{2}'), '').trim();
                final response = await _dio.get('$_baseUrl/search/movie', queryParameters: {
                  'api_key': _apiKey, 'query': cleanTitle, 'language': 'ar-SA',
                });
                final results = response.data['results'] as List;
                if (results.isEmpty) return movie;
                
                final tmdbId = results[0]['id'] as int;
                final details = await _dio.get('$_baseUrl/movie/$tmdbId', queryParameters: {
                  'api_key': _apiKey, 'language': 'ar-SA',
                });
                
                return movie.copyWith(
                  poster: details.data['poster_path'] != null ? '$_imageBase/w500${details.data['poster_path']}' : movie.poster,
                  backdrop: details.data['backdrop_path'] != null ? '$_imageBase/w1280${details.data['backdrop_path']}' : movie.backdrop,
                  overview: details.data['overview'] ?? movie.overview,
                  rating: (details.data['vote_average'] ?? 0).toDouble(),
                  genres: (details.data['genres'] as List? ?? []).map((g) => g['name'] as String).toList(),
                  tmdbId: tmdbId,
                );
              } catch (e) {
                print('TMDB error: $e');
                return movie;
              }
            }
          }
          DART_EOF
            echo "✅ Created tmdb_service.dart"
          fi
          
          # 3. site_movie_card.dart
          if [ ! -f "lib/widgets/site_movie_card.dart" ]; then
            mkdir -p lib/widgets
            cat > lib/widgets/site_movie_card.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import '../models/site_movie.dart';
          import '../lang.dart';

          class SiteMovieCard extends StatelessWidget {
            final SiteMovie movie;
            const SiteMovieCard({super.key, required this.movie});

            @override
            Widget build(BuildContext context) {
              return Container(
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(12),
                  color: const Color(0xFF1B2430),
                ),
                child: ClipRRect(
                  borderRadius: BorderRadius.circular(12),
                  child: Stack(
                    fit: StackFit.expand,
                    children: [
                      movie.poster.isNotEmpty
                          ? CachedNetworkImage(imageUrl: movie.poster, fit: BoxFit.cover,
                              errorWidget: (_, __, ___) => Container(color: const Color(0xFF1B2430), child: const Icon(Icons.movie, size: 40, color: Colors.grey)))
                          : Container(color: const Color(0xFF1B2430), child: const Icon(Icons.movie, size: 40, color: Colors.grey)),
                      Positioned(
                        bottom: 0, left: 0, right: 0,
                        child: Container(
                          padding: const EdgeInsets.all(8),
                          decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Colors.transparent, Colors.black87])),
                          child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Text(movie.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold)),
                            const SizedBox(height: 4),
                            Row(children: [
                              if (movie.qualityLabel.isNotEmpty)
                                Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                  decoration: BoxDecoration(color: movie.isMultiQuality ? Colors.purple : AppTheme.accent, borderRadius: BorderRadius.circular(4)),
                                  child: Text(movie.qualityLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.black))),
                              const SizedBox(width: 4),
                              Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                decoration: BoxDecoration(color: movie.hasSubtitle ? Colors.green : Colors.grey.shade700, borderRadius: BorderRadius.circular(4)),
                                child: Text(movie.subtitleLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.white))),
                            ]),
                          ]),
                        ),
                      ),
                      Positioned(top: 6, left: 6, child: Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                        decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(4)),
                        child: Text(movie.siteName, style: const TextStyle(fontSize: 9, color: Colors.white)))),
                      if (movie.rating > 0)
                        Positioned(top: 6, right: 6, child: Container(padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                          decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(4)),
                          child: Row(mainAxisSize: MainAxisSize.min, children: [
                            const Icon(Icons.star, size: 12, color: Color(0xFFFFC107)),
                            const SizedBox(width: 2),
                            Text(movie.rating.toStringAsFixed(1), style: const TextStyle(fontSize: 10, color: Colors.white)),
                          ]))),
                    ],
                  ),
                ),
              );
            }
          }
          DART_EOF
            echo "✅ Created site_movie_card.dart"
          fi

      - name: Fix Dart syntax errors
        run: |
          echo "=== Fixing Dart syntax errors ==="
          
          # 1. إصلاح ui.dart - حذف الفاصلة المنقوطة الزائدة
          if [ -f "lib/ui.dart" ]; then
            python3 << 'PYTHON_EOF'
          import re
          with open('lib/ui.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # حذف ;; الزائدة
          content = content.replace(']));;', ']));')
          content = content.replace(']));;', ']));')  # مرتين للاحتياط
          
          # إصلاح _sortItem
          content = content.replace(
              'Widget _sortItem(String v, String t) => PopupMenuItem(',
              'PopupMenuItem<String> _sortItem(String v, String t) => PopupMenuItem<String>('
          )
          
          with open('lib/ui.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ Fixed ui.dart")
          PYTHON_EOF
          fi
          
          # 2. إصلاح sites_home_screen.dart - إضافة import lang.dart
          if [ -f "lib/screens/sites_home_screen.dart" ]; then
            python3 << 'PYTHON_EOF'
          with open('lib/screens/sites_home_screen.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          
          if "import '../lang.dart';" not in content:
              content = content.replace(
                  "import '../core.dart';",
                  "import '../core.dart';\nimport '../lang.dart';"
              )
          
          with open('lib/screens/sites_home_screen.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ Fixed sites_home_screen.dart")
          PYTHON_EOF
          fi
          
          # 3. إصلاح sites_manager.dart - null safety
          if [ -f "lib/services/sites_manager.dart" ]; then
            python3 << 'PYTHON_EOF'
          with open('lib/services/sites_manager.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # إصلاح _enrichMovies
          old_code = """final futures = batch.map((movie) async {
        var enrichedMovie = await TmdbService.enrichMovie(movie);

        try {
          final hasSub = await SubtitleService.hasSubtitle(
            title: enrichedMovie.title,
            tmdbId: enrichedMovie.tmdbId,
          );
          enrichedMovie = enrichedMovie.copyWith(
            hasSubtitle: hasSub,
            subtitleLang: hasSub ? 'ar' : null,
          );
        } catch (_) {}

        return enrichedMovie;
      });"""
          
          new_code = """final futures = batch.map<Future<SiteMovie>>((movie) async {
        final enrichedMovie = await TmdbService.enrichMovie(movie) ?? movie;

        try {
          final hasSub = await SubtitleService.hasSubtitle(
            title: enrichedMovie.title,
            tmdbId: enrichedMovie.tmdbId,
          );
          return enrichedMovie.copyWith(
            hasSubtitle: hasSub,
            subtitleLang: hasSub ? 'ar' : null,
          );
        } catch (_) {
          return enrichedMovie;
        }
      });"""
          
          content = content.replace(old_code, new_code)
          
          with open('lib/services/sites_manager.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ Fixed sites_manager.dart")
          PYTHON_EOF
          fi

      - name: Create Android platform
        run: flutter create . --platforms android --no-overwrite

      - name: Configure Gradle with Kotlin 2.0 and compileSdk 35
        run: |
          echo "=== Configuring Gradle ==="
          
          # settings.gradle مع Kotlin 2.0.0
          cat > android/settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.0" apply false
          }
          include ":app"
          SETTINGS_EOF
          echo "✅ settings.gradle with Kotlin 2.0.0"
          
          # تعديل app/build.gradle باستخدام Python (أكثر موثوقية)
          python3 << 'PYTHON_EOF'
          import re
          
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          # حذف أي compileSdk موجود
          content = re.sub(r'\s*compileSdk\s+\d+\s*', '\n', content)
          content = re.sub(r'\s*compileSdkVersion\s+\d+\s*', '\n', content)
          
          # إضافة compileSdk 35 بعد android {
          content = re.sub(
              r'android\s*{',
              'android {\n    compileSdk 35',
              content
          )
          
          # تحديث minSdk و targetSdk
          content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', content)
          content = re.sub(r'minSdk\s+\d+', 'minSdk 21', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', content)
          content = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', content)
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          
          print("✅ Updated app/build.gradle with compileSdk 35")
          PYTHON_EOF
          
          # تعديل build.gradle الرئيسي
          python3 << 'PYTHON_EOF'
          import re
          
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          
          # إضافة ext.flutter إذا غير موجود
          if 'ext {' not in content and 'ext.flutter' not in content:
              content = content.replace(
                  'allprojects {',
                  'ext {\n    flutter = [\n        compileSdkVersion: 35,\n        minSdkVersion: 21,\n        targetSdkVersion: 35,\n        ndkVersion: "25.1.8937393"\n    ]\n}\n\nallprojects {'
              )
          
          with open('android/build.gradle', 'w') as f:
              f.write(content)
          
          print("✅ Updated root build.gradle with flutter ext")
          PYTHON_EOF
          
          # تعديل ملفات الحزم في pub-cache
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -path "*/android/*" 2>/dev/null | while read f; do
            sed -i 's/flutter\.compileSdkVersion/35/g' "$f"
            sed -i 's/flutter\.minSdkVersion/21/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/35/g' "$f"
          done
          
          echo "=== Verification ==="
          grep -n "compileSdk" android/app/build.gradle | head -5
          grep -n "kotlin" android/settings.gradle | head -5

      - name: Patch AndroidManifest for TV
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          echo "✅ AndroidManifest patched"

      - name: Write MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          cat > "$MAIN_ACT" << 'KOTLIN_EOF'
          package com.example.killlk

          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "isTv") {
                              val pm = packageManager
                              result.success(
                                  pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||
                                      pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION)
                              )
                          } else if (call.method == "openExternal") {
                              val url = call.argument<String>("url")
                              if (url == null) { result.success(false); return@setMethodCallHandler }
                              val uri = android.net.Uri.parse(url)
                              val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)
                              intent.setDataAndType(uri, "video/*")
                              try {
                                  startActivity(android.content.Intent.createChooser(intent, "Play with"))
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN_EOF

      - name: Update pubspec.yaml with overrides
        run: |
          python3 << 'PYTHON_EOF'
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # التحقق من dependency_overrides
          if 'dependency_overrides:' not in content:
              content += '''

          dependency_overrides:
            package_info_plus: ^8.3.0
            wakelock_plus: ^1.2.8
            connectivity_plus: ^6.1.0
            path_provider: ^2.1.5
          '''
          else:
              # إضافة path_provider إذا غير موجود
              if 'path_provider:' not in content:
                  content = content.replace(
                      'dependency_overrides:',
                      'dependency_overrides:\n  path_provider: ^2.1.5'
                  )
          
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print("✅ Updated pubspec.yaml")
          PYTHON_EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
