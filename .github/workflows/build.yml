name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing files if not exist
        run: |
          echo "=== Creating missing files ==="
          
          # إنشاء lib/models/site_movie.dart إذا غير موجود
          if [ ! -f "lib/models/site_movie.dart" ]; then
            mkdir -p lib/models
            cat > lib/models/site_movie.dart << 'DART_EOF'
          class SiteMovie {
            final String id;
            final String title;
            final String year;
            final String site;
            final String videoUrl;
            final String poster;
            final String backdrop;
            final String overview;
            final double rating;
            final String duration;
            final List<String> genres;
            final List<VideoQuality> qualities;
            final bool hasSubtitle;
            final String? subtitleLang;
            final int? tmdbId;

            SiteMovie({
              required this.id,
              required this.title,
              required this.year,
              required this.site,
              required this.videoUrl,
              this.poster = '',
              this.backdrop = '',
              this.overview = '',
              this.rating = 0,
              this.duration = '',
              this.genres = const [],
              this.qualities = const [],
              this.hasSubtitle = false,
              this.subtitleLang,
              this.tmdbId,
            });

            bool get isMultiQuality => qualities.length > 1;

            String get qualityLabel {
              if (qualities.isEmpty) return '';
              if (isMultiQuality) return 'متعدد الجودات';
              return qualities.first.label;
            }

            String get subtitleLabel => hasSubtitle ? 'مترجم' : 'بدون ترجمة';

            String get siteName {
              switch (site) {
                case 'plex': return 'Plex';
                case 'roku': return 'Roku';
                case 'crackle': return 'Crackle';
                default: return site;
              }
            }

            SiteMovie copyWith({
              String? poster,
              String? backdrop,
              String? overview,
              double? rating,
              List<String>? genres,
              bool? hasSubtitle,
              String? subtitleLang,
              int? tmdbId,
            }) {
              return SiteMovie(
                id: id,
                title: title,
                year: year,
                site: site,
                videoUrl: videoUrl,
                poster: poster ?? this.poster,
                backdrop: backdrop ?? this.backdrop,
                overview: overview ?? this.overview,
                rating: rating ?? this.rating,
                duration: duration,
                genres: genres ?? this.genres,
                qualities: qualities,
                hasSubtitle: hasSubtitle ?? this.hasSubtitle,
                subtitleLang: subtitleLang ?? this.subtitleLang,
                tmdbId: tmdbId ?? this.tmdbId,
              );
            }
          }

          class VideoQuality {
            final String label;
            final String url;
            final int bandwidth;

            VideoQuality({required this.label, required this.url, this.bandwidth = 0});

            Map<String, dynamic> toJson() => {'label': label, 'url': url, 'bandwidth': bandwidth};

            factory VideoQuality.fromJson(Map<String, dynamic> json) => VideoQuality(
              label: json['label'] ?? '',
              url: json['url'] ?? '',
              bandwidth: json['bandwidth'] ?? 0,
            );
          }
          DART_EOF
            echo "✅ Created lib/models/site_movie.dart"
          fi
          
          # إنشاء lib/services/tmdb_service.dart إذا غير موجود
          if [ ! -f "lib/services/tmdb_service.dart" ]; then
            cat > lib/services/tmdb_service.dart << 'DART_EOF'
          import 'package:dio/dio.dart';
          import '../models/site_movie.dart';

          class TmdbService {
            static const String _apiKey = '9ba4e29354937364c2202857afcd7f94';
            static const String _baseUrl = 'https://api.themoviedb.org/3';
            static const String _imageBase = 'https://image.tmdb.org/t/p';

            static final Dio _dio = Dio(BaseOptions(
              connectTimeout: const Duration(seconds: 10),
              receiveTimeout: const Duration(seconds: 15),
            ));

            static Future<SiteMovie?> enrichMovie(SiteMovie movie) async {
              try {
                final searchResult = await _searchMovie(movie.title, movie.year);
                if (searchResult == null) return movie;

                final tmdbId = searchResult['id'] as int;
                final details = await _getDetails(tmdbId);

                return movie.copyWith(
                  poster: details['poster'] ?? movie.poster,
                  backdrop: details['backdrop'] ?? movie.backdrop,
                  overview: details['overview'] ?? movie.overview,
                  rating: details['rating'] ?? movie.rating,
                  genres: details['genres'] ?? movie.genres,
                  tmdbId: tmdbId,
                );
              } catch (e) {
                print('TMDB error: $e');
                return movie;
              }
            }

            static Future<Map<String, dynamic>?> _searchMovie(String title, String year) async {
              try {
                final response = await _dio.get('$_baseUrl/search/movie', queryParameters: {
                  'api_key': _apiKey, 'query': title, 'language': 'ar-SA',
                  'include_adult': false, if (year.isNotEmpty) 'year': year,
                });
                final results = response.data['results'] as List;
                return results.isEmpty ? null : results[0];
              } catch (_) {
                return null;
              }
            }

            static Future<Map<String, dynamic>> _getDetails(int tmdbId) async {
              try {
                final response = await _dio.get('$_baseUrl/movie/$tmdbId', queryParameters: {
                  'api_key': _apiKey, 'language': 'ar-SA',
                });
                final data = response.data;
                return {
                  'poster': data['poster_path'] != null ? '$_imageBase/w500${data['poster_path']}' : null,
                  'backdrop': data['backdrop_path'] != null ? '$_imageBase/w1280${data['backdrop_path']}' : null,
                  'overview': data['overview'] ?? '',
                  'rating': (data['vote_average'] ?? 0).toDouble(),
                  'genres': (data['genres'] as List? ?? []).map((g) => g['name'] as String).toList(),
                };
              } catch (_) {
                return {};
              }
            }
          }
          DART_EOF
            echo "✅ Created lib/services/tmdb_service.dart"
          fi
          
          # إنشاء lib/widgets/site_movie_card.dart إذا غير موجود
          if [ ! -f "lib/widgets/site_movie_card.dart" ]; then
            mkdir -p lib/widgets
            cat > lib/widgets/site_movie_card.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import '../models/site_movie.dart';
          import '../core.dart';
          import '../lang.dart';

          class SiteMovieCard extends StatelessWidget {
            final SiteMovie movie;
            const SiteMovieCard({super.key, required this.movie});

            @override
            Widget build(BuildContext context) {
              return GestureDetector(
                onTap: () {
                  // سيتم إصلاح هذا لاحقاً
                },
                child: Container(
                  decoration: BoxDecoration(
                    borderRadius: BorderRadius.circular(12),
                    color: const Color(0xFF1B2430),
                  ),
                  child: ClipRRect(
                    borderRadius: BorderRadius.circular(12),
                    child: Stack(
                      fit: StackFit.expand,
                      children: [
                        movie.poster.isNotEmpty
                            ? CachedNetworkImage(
                                imageUrl: movie.poster,
                                fit: BoxFit.cover,
                                errorWidget: (_, __, ___) => Container(
                                  color: const Color(0xFF1B2430),
                                  child: const Icon(Icons.movie, size: 40, color: Colors.grey),
                                ),
                              )
                            : Container(
                                color: const Color(0xFF1B2430),
                                child: const Icon(Icons.movie, size: 40, color: Colors.grey),
                              ),
                        Positioned(
                          bottom: 0, left: 0, right: 0,
                          child: Container(
                            padding: const EdgeInsets.all(8),
                            decoration: const BoxDecoration(
                              gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Colors.transparent, Colors.black87]),
                            ),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(movie.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold)),
                                const SizedBox(height: 4),
                                Row(children: [
                                  if (movie.qualityLabel.isNotEmpty)
                                    Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                      decoration: BoxDecoration(color: movie.isMultiQuality ? Colors.purple : AppTheme.accent, borderRadius: BorderRadius.circular(4)),
                                      child: Text(movie.qualityLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.black)),
                                    ),
                                  const SizedBox(width: 4),
                                  Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                    decoration: BoxDecoration(color: movie.hasSubtitle ? Colors.green : Colors.grey.shade700, borderRadius: BorderRadius.circular(4)),
                                    child: Text(movie.subtitleLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.white)),
                                  ),
                                ]),
                              ],
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART_EOF
            echo "✅ Created lib/widgets/site_movie_card.dart"
          fi
          
          echo "=== All files created ==="

      - name: Fix ui.dart _sortItem method
        run: |
          echo "=== Fixing ui.dart ==="
          
          # إصلاح دالة _sortItem
          sed -i 's/Widget _sortItem(String v, String t) => PopupMenuItem(/Widget _sortItem(String v, String t) => PopupMenuItem<String>(/g' lib/ui.dart
          
          echo "✅ Fixed _sortItem in ui.dart"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.3
          channel: stable

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Create Android platform
        run: flutter create . --platforms android --no-overwrite

      - name: Write modern settings.gradle with Kotlin 2.0
        run: |
          cat > android/settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.0" apply false
              id "org.jetbrains.kotlin.android" version "2.0.0" apply false
          }
          include ":app"
          SETTINGS_EOF
          echo "✅ settings.gradle with Kotlin 2.0.0"

      - name: Patch AndroidManifest for TV
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Write MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          cat > "$MAIN_ACT" << 'KOTLIN_EOF'
          package com.example.killlk

          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "isTv") {
                              val pm = packageManager
                              result.success(
                                  pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||
                                      pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION)
                              )
                          } else if (call.method == "openExternal") {
                              val url = call.argument<String>("url")
                              if (url == null) { result.success(false); return@setMethodCallHandler }
                              val uri = android.net.Uri.parse(url)
                              val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)
                              intent.setDataAndType(uri, "video/*")
                              try {
                                  startActivity(android.content.Intent.createChooser(intent, "Play with"))
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN_EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Patch Gradle files for compileSdk 35
        run: |
          echo "=== Patching for compileSdk 35 ==="
          
          # تحديث compileSdk في app/build.gradle
          if ! grep -q "compileSdk 35" android/app/build.gradle; then
            sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle
            if ! grep -q "compileSdk 35" android/app/build.gradle; then
              sed -i '/android {/a\    compileSdk 35' android/app/build.gradle
            fi
          fi
          
          # إضافة ext.flutter
          if ! grep -q "ext {" android/build.gradle; then
            sed -i '0,/allprojects/s/allprojects/ext {\n    flutter = [\n        compileSdkVersion: 35,\n        minSdkVersion: 21,\n        targetSdkVersion: 35\n    ]\n}\n\nallprojects/' android/build.gradle
          fi
          
          # إصلاح ملفات الحزم
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle" -path "*/android/*" 2>/dev/null | while read f; do
            sed -i 's/flutter\.compileSdkVersion/35/g' "$f"
            sed -i 's/flutter\.minSdkVersion/21/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/35/g' "$f"
          done
          
          echo "✅ All Gradle files patched"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
