name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.3

      - name: توليد ملفات Android الناقصة
        run: flutter create . --platforms android

      - uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: debug-keystore-v1

      - name: مفتاح توقيع ثابت + طباعة SHA1
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore android/app/debug.keystore -storepass android | grep SHA1 || true

      - name: ربط خدمات قوقل + اسم التطبيق
        run: |
          sed -i '/^plugins {/a\    id "com.google.gms.google-services" version "4.4.2"' android/app/build.gradle
          sed -i 's/android:label="tele_cinema"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml

      - name: إعداد Gradle لتوافق الحزم الحديثة
        run: |
          FLUTTER_ROOT=$(flutter --no-version-check config --machine 2>/dev/null | grep -oE '"flutterRoot":"[^"]+"' | cut -d'"' -f4)
          FLUTTER_ROOT=${FLUTTER_ROOT:-$FLUTTER_ROOT}
          [ -z "$FLUTTER_ROOT" ] && FLUTTER_ROOT=$(which flutter | sed 's|/bin/flutter||')
          echo "sdk.dir=$FLUTTER_ROOT" > android/local.properties
          cat >> android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          EOF
          # تعريف flutter و تحديد compileSdk في ملف التطبيق
          sed -i '1i def flutterRoot = localProperties.getProperty("flutter.sdk")' android/app/build.gradle
          sed -i '1i apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"' android/app/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 34/' android/app/build.gradle
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/' android/app/build.gradle
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 34/' android/app/build.gradle
          # ترقية Gradle وAGP لتوافق package_info_plus
          sed -i "s|gradle/[0-9.]*-all|gradle/8.4-all|g" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          sed -i "s/classpath 'com.android.tools.build:gradle:[^']*'/classpath 'com.android.tools.build:gradle:8.1.0'/g" android/build.gradle
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.1.0"|' android/settings.gradle 2>/dev/null || true
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "1.9.0"|' android/settings.gradle 2>/dev/null || true

      - name: البناء
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
