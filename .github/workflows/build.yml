name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3
          channel: stable

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Create missing widget file
        run: |
          if [ ! -f "lib/widgets/site_movie_card.dart" ]; then
            mkdir -p lib/widgets
            cat > lib/widgets/site_movie_card.dart << 'DART_EOF'
          import 'package:flutter/material.dart';
          import 'package:cached_network_image/cached_network_image.dart';
          import '../models/site_movie.dart';
          import '../lang.dart';

          class SiteMovieCard extends StatelessWidget {
            final SiteMovie movie;
            const SiteMovieCard({super.key, required this.movie});

            @override
            Widget build(BuildContext context) {
              return Container(
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(12),
                  color: const Color(0xFF1B2430),
                ),
                child: ClipRRect(
                  borderRadius: BorderRadius.circular(12),
                  child: Stack(
                    fit: StackFit.expand,
                    children: [
                      movie.poster.isNotEmpty
                          ? CachedNetworkImage(
                              imageUrl: movie.poster,
                              fit: BoxFit.cover,
                              errorWidget: (_, __, ___) => Container(
                                  color: const Color(0xFF1B2430),
                                  child: const Icon(Icons.movie, size: 40, color: Colors.grey)))
                          : Container(
                              color: const Color(0xFF1B2430),
                              child: const Icon(Icons.movie, size: 40, color: Colors.grey)),
                      Positioned(
                        bottom: 0,
                        left: 0,
                        right: 0,
                        child: Container(
                          padding: const EdgeInsets.all(8),
                          decoration: const BoxDecoration(
                            gradient: LinearGradient(
                              begin: Alignment.topCenter,
                              end: Alignment.bottomCenter,
                              colors: [Colors.transparent, Colors.black87],
                            ),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(movie.title, maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold)),
                              const SizedBox(height: 4),
                              Row(children: [
                                if (movie.qualityLabel.isNotEmpty)
                                  Container(
                                    padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                    decoration: BoxDecoration(color: movie.isMultiQuality ? Colors.purple : AppTheme.accent, borderRadius: BorderRadius.circular(4)),
                                    child: Text(movie.qualityLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.black))),
                                const SizedBox(width: 4),
                                Container(
                                  padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                                  decoration: BoxDecoration(color: movie.hasSubtitle ? Colors.green : Colors.grey.shade700, borderRadius: BorderRadius.circular(4)),
                                  child: Text(movie.subtitleLabel, style: const TextStyle(fontSize: 9, fontWeight: FontWeight.bold, color: Colors.white))),
                              ]),
                            ],
                          ),
                        ),
                      ),
                      Positioned(
                        top: 6,
                        left: 6,
                        child: Container(
                          padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                          decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(4)),
                          child: Text(movie.siteName, style: const TextStyle(fontSize: 9, color: Colors.white)))),
                      if (movie.rating > 0)
                        Positioned(
                          top: 6,
                          right: 6,
                          child: Container(
                            padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                            decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(4)),
                            child: Row(mainAxisSize: MainAxisSize.min, children: [
                              const Icon(Icons.star, size: 12, color: Color(0xFFFFC107)),
                              const SizedBox(width: 2),
                              Text(movie.rating.toStringAsFixed(1), style: const TextStyle(fontSize: 10, color: Colors.white)),
                            ]))),
                    ],
                  ),
                ),
              );
            }
          }
          DART_EOF
            echo "Created site_movie_card.dart"
          else
            echo "site_movie_card.dart already exists"
          fi

      - name: Fix Dart syntax issues
        run: |
          sed -i 's/]));;/]));/g' lib/ui.dart
          if [ -f "lib/screens/sites_home_screen.dart" ]; then
            grep -q "lang.dart" lib/screens/sites_home_screen.dart || sed -i "1i import '../lang.dart';" lib/screens/sites_home_screen.dart
          fi
          if [ -f "lib/widgets/site_movie_card.dart" ]; then
            grep -q "lang.dart" lib/widgets/site_movie_card.dart || sed -i "1i import '../lang.dart';" lib/widgets/site_movie_card.dart
          fi
          echo "Dart fixes applied"

      - name: Create Android platform
        run: flutter create . --platforms android --no-overwrite

      - name: Patch AndroidManifest for TV
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          echo "Manifest patched"

      - name: Write MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          cat > "$MAIN_ACT" << 'KOTLIN_EOF'
          package com.example.killlk

          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "isTv") {
                              val pm = packageManager
                              result.success(
                                  pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||
                                      pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION)
                              )
                          } else if (call.method == "openExternal") {
                              val url = call.argument<String>("url")
                              if (url == null) { result.success(false); return@setMethodCallHandler }
                              val uri = android.net.Uri.parse(url)
                              val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)
                              intent.setDataAndType(uri, "video/*")
                              try {
                                  startActivity(android.content.Intent.createChooser(intent, "Play with"))
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KOTLIN_EOF
          echo "MainActivity written"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
