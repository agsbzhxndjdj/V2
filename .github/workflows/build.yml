name: Build iOS for Scarlet

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate iOS folder
        run: flutter create . --platforms ios --no-overwrite

      - name: Configure iOS settings
        run: |
          # السماح بـ HTTP
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist 2>/dev/null || true

          # اسم التطبيق
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName تلي سينما" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string تلي سينما" ios/Runner/Info.plist 2>/dev/null || true

          # دعم الاتجاهات
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationPortrait" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationLandscapeLeft" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations: string UIInterfaceOrientationLandscapeRight" ios/Runner/Info.plist

          # أقل إصدار iOS
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" ios/Runner/Info.plist 2>/dev/null || true

      - name: Set deployment target in Podfile
        run: |
          cd ios
          if [ -f Podfile ]; then
            sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/" Podfile
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package as IPA for Scarlet
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r tele-cinema-ios.ipa Payload/
          rm -rf Payload

      - name: Upload IPA for Scarlet
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-ios-scarlet
          path: build/ios/iphoneos/tele-cinema-ios.ipa
          retention-days: 14
