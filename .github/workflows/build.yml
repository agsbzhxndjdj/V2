name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter 3.27.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3
          channel: stable

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Fix pubspec.yaml
        run: |
          python3 << 'PYEOF'
          import re
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'\n\s*fonts:.*?(?=\n\n|\Z)', '', content, flags=re.DOTALL)
          content = re.sub(r'\ndependency_overrides:.*', '', content, flags=re.DOTALL)
          content += '''

          dependency_overrides:
            path_provider: 2.1.4
            package_info_plus: 8.3.1
            wakelock_plus: 1.2.8
            connectivity_plus: 6.1.5
            file_picker: 8.1.2
            flutter_local_notifications: 17.2.3
          '''
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          print("pubspec fixed")
          PYEOF

      - name: Remove fake services and write REAL ones
        run: |
          # حذف الخدمات الوهمية
          rm -f lib/services/internet_archive_service.dart
          
          mkdir -p lib/models lib/services lib/screens lib/widgets
          
          # ✅ Internet Archive - مصدر حقيقي يعمل 100%
          cat > lib/services/internet_archive_service.dart << 'EOF'
          import 'package:dio/dio.dart';
          import '../models/site_movie.dart';

          class InternetArchiveService {
            static final Dio _dio = Dio(BaseOptions(
              connectTimeout: const Duration(seconds: 15),
              receiveTimeout: const Duration(seconds: 20),
            ));

            static Future<List<SiteMovie>> getMovies({int limit = 20}) async {
              try {
                final res = await _dio.get('https://archive.org/advancedsearch.php',
                  queryParameters: {
                    'q': 'collection:(feature_films) AND mediatype:(movies)',
                    'fl[]': 'identifier,title,year,description,downloads',
                    'sort[]': 'downloads desc',
                    'rows': limit,
                    'page': 1,
                    'output': 'json',
                  });
                final docs = (res.data['response']?['docs'] as List?) ?? [];
                final movies = <SiteMovie>[];
                for (final d in docs) {
                  final m = await _withVideo(d);
                  if (m != null) movies.add(m);
                }
                return movies;
              } catch (e) {
                print('Archive error: $e');
                return [];
              }
            }

            static Future<SiteMovie?> _withVideo(Map d) async {
              try {
                final id = (d['identifier'] ?? '').toString();
                if (id.isEmpty) return null;
                final meta = await _dio.get('https://archive.org/metadata/$id');
                final files = (meta.data['files'] as List?) ?? [];
                String? videoFile;
                for (final f in files) {
                  final name = (f['name'] ?? '').toString();
                  if (name.endsWith('.mp4') || name.endsWith('.avi') || name.endsWith('.mkv')) {
                    videoFile = name;
                    break;
                  }
                }
                if (videoFile == null) return null;
                final url = 'https://archive.org/download/$id/$videoFile';
                return SiteMovie(
                  id: 'ia_$id',
                  title: (d['title'] ?? 'فيلم').toString(),
                  year: (d['year'] ?? '').toString(),
                  site: 'archive',
                  videoUrl: url,
                  poster: 'https://archive.org/services/img/$id',
                  overview: _clean(d['description']),
                  rating: 7.0,
                  genres: ['كلاسيكي'],
                  qualities: [VideoQuality(label: 'HD', url: url)],
                );
              } catch (e) {
                return null;
              }
            }

            static String _clean(dynamic desc) {
              if (desc is List) return desc.join(' ');
              if (desc is String) return desc.length > 300 ? desc.substring(0, 300) : desc;
              return '';
            }
          }
          EOF
          echo "✅ internet_archive_service.dart (REAL)"

          # ✅ تحديث site_movie لدعم archive
          cat > lib/models/site_movie.dart << 'EOF'
          class SiteMovie {
            final String id, title, year, site, videoUrl, poster, backdrop, overview, duration;
            final double rating;
            final List<String> genres;
            final List<VideoQuality> qualities;
            final bool hasSubtitle;
            final String? subtitleLang;
            final int? tmdbId;
            SiteMovie({required this.id, required this.title, required this.year, required this.site,
              required this.videoUrl, this.poster = '', this.backdrop = '', this.overview = '',
              this.rating = 0, this.duration = '', this.genres = const [],
              this.qualities = const [], this.hasSubtitle = false, this.subtitleLang, this.tmdbId});
            bool get isMultiQuality => qualities.length > 1;
            String get qualityLabel => qualities.isEmpty ? '' : (isMultiQuality ? 'متعدد' : qualities.first.label);
            String get subtitleLabel => hasSubtitle ? 'مترجم' : 'بدون ترجمة';
            String get siteName => site == 'plex' ? 'Plex' : site == 'roku' ? 'Roku' : site == 'crackle' ? 'Crackle' : site == 'archive' ? 'أرشيف' : site;
            SiteMovie copyWith({String? poster, String? backdrop, String? overview, double? rating,
                List<String>? genres, bool? hasSubtitle, String? subtitleLang, int? tmdbId}) {
              return SiteMovie(id: id, title: title, year: year, site: site, videoUrl: videoUrl, duration: duration,
                poster: poster ?? this.poster, backdrop: backdrop ?? this.backdrop,
                overview: overview ?? this.overview, rating: rating ?? this.rating,
                genres: genres ?? this.genres, qualities: qualities,
                hasSubtitle: hasSubtitle ?? this.hasSubtitle, subtitleLang: subtitleLang ?? this.subtitleLang,
                tmdbId: tmdbId ?? this.tmdbId);
            }
          }
          class VideoQuality {
            final String label, url;
            final int bandwidth;
            VideoQuality({required this.label, required this.url, this.bandwidth = 0});
          }
          EOF

          # ✅ تحديث sites_manager ليشمل Internet Archive
          cat > lib/services/sites_manager.dart << 'EOF'
          import '../models/site_movie.dart';
          import 'plex_service.dart';
          import 'roku_service.dart';
          import 'crackle_service.dart';
          import 'internet_archive_service.dart';
          import 'tmdb_service.dart';
          class SitesManager {
            static bool isSiteEnabled(String site) => true;
            static Future<List<SiteMovie>> getAllMovies({bool enrich = true}) async {
              final all = <SiteMovie>[];
              all.addAll(await InternetArchiveService.getMovies());
              all.addAll(await PlexService.getMovies());
              all.addAll(await RokuService.getMovies());
              all.addAll(await CrackleService.getMovies());
              return _dedup(all);
            }
            static Future<List<SiteMovie>> getMoviesFromSite(String site, {bool enrich = true}) async {
              List<SiteMovie> list;
              switch (site) {
                case 'plex': list = await PlexService.getMovies(); break;
                case 'roku': list = await RokuService.getMovies(); break;
                case 'crackle': list = await CrackleService.getMovies(); break;
                case 'archive': list = await InternetArchiveService.getMovies(); break;
                default: list = await InternetArchiveService.getMovies();
              }
              return list;
            }
            static Future<List<SiteMovie>> search(String query) async => [];
            static List<SiteMovie> _dedup(List<SiteMovie> l) {
              final seen = <String>{};
              return l.where((m) => seen.add(m.title)).toList();
            }
          }
          EOF

          # ✅ تحديث sites_home_screen لإضافة زر أرشيف
          cat > lib/screens/sites_home_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import '../models/site_movie.dart';
          import '../services/sites_manager.dart';
          import '../widgets/site_movie_card.dart';
          import '../lang.dart';
          class SitesHomeScreen extends StatefulWidget {
            const SitesHomeScreen({super.key});
            @override
            State<SitesHomeScreen> createState() => _SitesHomeScreenState();
          }
          class _SitesHomeScreenState extends State<SitesHomeScreen> {
            List<SiteMovie> _movies = [];
            bool _loading = true;
            String _selectedSite = 'all';
            @override
            void initState() { super.initState(); _loadMovies(); }
            Future<void> _loadMovies() async {
              setState(() => _loading = true);
              try {
                final movies = await SitesManager.getAllMovies();
                if (mounted) setState(() { _movies = movies; _loading = false; });
              } catch (e) { if (mounted) setState(() => _loading = false); }
            }
            Future<void> _loadSiteMovies(String site) async {
              setState(() { _selectedSite = site; _loading = true; });
              try {
                final movies = await SitesManager.getMoviesFromSite(site);
                if (mounted) setState(() { _movies = movies; _loading = false; });
              } catch (e) { if (mounted) setState(() => _loading = false); }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(backgroundColor: const Color(0xFF0B0F14),
                appBar: AppBar(backgroundColor: const Color(0xFF0B0F14),
                  title: const Text('المواقع', style: TextStyle(fontWeight: FontWeight.bold)),
                  actions: [IconButton(icon: const Icon(Icons.refresh),
                    onPressed: _selectedSite == 'all' ? _loadMovies : () => _loadSiteMovies(_selectedSite))]),
                body: Column(children: [
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 12),
                    child: Row(children: [
                      _btn('all', 'الكل', Icons.apps), const SizedBox(width: 6),
                      _btn('archive', 'أرشيف', Icons.folder_open), const SizedBox(width: 6),
                      _btn('plex', 'Plex', Icons.movie), const SizedBox(width: 6),
                      _btn('roku', 'Roku', Icons.tv), const SizedBox(width: 6),
                      _btn('crackle', 'Crackle', Icons.play_circle),
                    ])),
                  const SizedBox(height: 10),
                  Expanded(child: _loading ? const Center(child: CircularProgressIndicator())
                    : _movies.isEmpty ? const Center(child: Text('لا توجد أفلام', style: TextStyle(color: Colors.grey)))
                    : GridView.builder(padding: const EdgeInsets.all(8),
                        gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                          crossAxisCount: 3, childAspectRatio: 0.55, crossAxisSpacing: 8, mainAxisSpacing: 8),
                        itemCount: _movies.length,
                        itemBuilder: (c, i) => SiteMovieCard(movie: _movies[i]))),
                ]));
            }
            Widget _btn(String site, String label, IconData icon) {
              final sel = _selectedSite == site;
              return Expanded(child: GestureDetector(
                onTap: () { if (site == 'all') { setState(() => _selectedSite = 'all'); _loadMovies(); } else _loadSiteMovies(site); },
                child: Container(padding: const EdgeInsets.symmetric(vertical: 10),
                  decoration: BoxDecoration(color: sel ? AppTheme.accent : const Color(0xFF1B2430),
                    borderRadius: BorderRadius.circular(12),
                    border: Border.all(color: sel ? AppTheme.accent : Colors.transparent, width: 2)),
                  child: Column(children: [
                    Icon(icon, color: sel ? Colors.black : Colors.white70, size: 18),
                    const SizedBox(height: 3),
                    FittedBox(child: Text(label, style: TextStyle(color: sel ? Colors.black : Colors.white,
                      fontWeight: sel ? FontWeight.bold : FontWeight.normal, fontSize: 11))),
                  ]))));
            }
          }
          EOF
          echo "✅ Real services written"

      - name: Restore Settings button in ui.dart
        run: |
          python3 << 'PYEOF'
          with open('lib/ui.dart', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # إضافة import extra.dart إذا غير موجود
          if "import 'extra.dart';" not in content:
              content = content.replace("import 'core.dart';", "import 'core.dart';\nimport 'extra.dart';")
          
          # إضافة زر الإعدادات قبل زر التحديث
          if 'Icons.settings' not in content:
              content = content.replace(
                  "IconButton(icon: const Icon(Icons.refresh), onPressed: _refresh),",
                  "IconButton(icon: const Icon(Icons.settings), onPressed: () => Navigator.push(context, MaterialPageRoute(builder: (_) => const SettingsPage()))),\n          IconButton(icon: const Icon(Icons.refresh), onPressed: _refresh),")
          
          with open('lib/ui.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          print("✅ Settings button restored")
          PYEOF

      - name: Fix ui.dart syntax
        run: |
          sed -i 's/]));;/]));/g' lib/ui.dart 2>/dev/null || true
          sed -i 's/Widget _sortItem/PopupMenuItem<String> _sortItem/g' lib/ui.dart 2>/dev/null || true
          sed -i 's/=> PopupMenuItem(/=> PopupMenuItem<String>(/g' lib/ui.dart 2>/dev/null || true
          echo "syntax fixed"

      - name: Clean and create Android platform
        run: |
          rm -rf android
          flutter create . --platforms android
          if [ -f "android/app/build.gradle.kts" ]; then echo "BUILD_TYPE=kts" >> $GITHUB_ENV; else echo "BUILD_TYPE=gradle" >> $GITHUB_ENV; fi

      - name: Patch build.gradle
        run: |
          python3 << 'PYEOF'
          import re, os
          bt = os.environ.get('BUILD_TYPE', 'gradle')
          fp = 'android/app/build.gradle.kts' if bt == 'kts' else 'android/app/build.gradle'
          with open(fp, 'r') as f: content = f.read()
          if bt == 'kts':
              content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', content)
              content = re.sub(r'ndkVersion\s*=\s*"[^"]*"', 'ndkVersion = "27.0.12077973"', content)
          else:
              content = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', content)
              content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
              content = re.sub(r'ndkVersion\s+"[^"]*"', 'ndkVersion "27.0.12077973"', content)
              content = re.sub(r'ndkVersion\s+flutter\.ndkVersion', 'ndkVersion "27.0.12077973"', content)
          with open(fp, 'w') as f: f.write(content)
          print("Patched", fp)
          PYEOF

      - name: Patch AndroidManifest for TV
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Write MainActivity
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          cat > "$MAIN_ACT" << 'EOF'
          package com.example.killlk
          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "isTv") {
                              val pm = packageManager
                              result.success(pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) || pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION))
                          } else if (call.method == "openExternal") {
                              val url = call.argument<String>("url")
                              if (url == null) { result.success(false); return@setMethodCallHandler }
                              val uri = android.net.Uri.parse(url)
                              val intent = android.content.Intent(android.content.Intent.ACTION_VIEW, uri)
                              intent.setDataAndType(uri, "video/*")
                              try { startActivity(android.content.Intent.createChooser(intent, "Play with")); result.success(true) }
                              catch (e: Exception) { result.success(false) }
                          } else { result.notImplemented() }
                      }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons || echo "Icons failed, continuing..."

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
