name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.3
          channel: stable
      - run: flutter config --no-analytics
      - run: |
          rm -rf android
          flutter create . --platforms android
      - run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter pub run flutter_launcher_icons || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
