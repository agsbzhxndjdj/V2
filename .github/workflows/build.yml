name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Generate android folder
        run: flutter create . --platforms android --no-overwrite

      - name: Inject keystore
        run: |
          if [ -f KEYSTORE_B64 ]; then base64 -d -i KEYSTORE_B64 > android/app/telecinema.keystore; echo "keystore decoded OK"; fi
          if [ -f telecinema.keystore ]; then cp telecinema.keystore android/app/telecinema.keystore; echo "keystore copied OK"; fi
          ls -la android/app/google-services.json android/app/telecinema.keystore || true

      - name: Patch gradle (google-services via classpath + signing)
        run: |
          python3 - << 'PYEOF'
          # 1) إضافة classpath في android/build.gradle
          p = 'android/build.gradle'
          s = open(p).read()
          if 'google-services' not in s:
              if 'buildscript {' in s:
                  # الطريقة الكلاسيكية
                  s = s.replace('ext.kotlin_version', 'ext.kotlin_version', 1)  # لا تغيير
                  if 'dependencies {' in s:
                      s = s.replace('dependencies {', 'dependencies {\n        classpath "com.google.gms:google-services:4.4.0"', 1)
                  elif 'subprojects {' in s:
                      s = s.replace('buildscript {', 'buildscript {\n    dependencies {\n        classpath "com.google.gms:google-services:4.4.0"\n    }', 1)
              else:
                  # إذا كان build.gradle جديد (plugins block) — نضيف classpath block
                  s = 'buildscript {\n    dependencies {\n        classpath "com.google.gms:google-services:4.4.0"\n    }\n}\n\n' + s
          open(p, 'w').write(s)
          print('build.gradle patched')

          # 2) تعديل android/app/build.gradle
          p = 'android/app/build.gradle'
          s = open(p).read()
          # إضافة apply plugin
          if 'google-services' not in s:
              s = s.rstrip() + '\napply plugin: "com.google.gms.google-services"\n'

          # توقيع release
          sig = """    signingConfigs {
              release {
                  storeFile file('telecinema.keystore')
                  storePassword '12345678'
                  keyAlias 'telecinema'
                  keyPassword '12345678'
              }
          }
          """
          if 'signingConfigs' not in s:
              s = s.replace('    buildTypes {', sig + '\n    buildTypes {', 1)
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          open(p, 'w').write(s)
          print('app/build.gradle patched')
          PYEOF

      - name: Patch AndroidManifest (HTTP + الاسم + Android TV + الإشعارات)
        run: |
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="تلي سينما"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' android/app/src/main/AndroidManifest.xml
          grep -n "usesCleartextTraffic\|LEANBACK\|POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml

      - name: Patch MainActivity (كشف Android TV)
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          PKG=$(head -n 1 "$MAIN_ACT")
          {
            echo "$PKG"
            echo ''
            echo 'import android.content.pm.PackageManager'
            echo 'import io.flutter.embedding.android.FlutterActivity'
            echo 'import io.flutter.embedding.engine.FlutterEngine'
            echo 'import io.flutter.plugin.common.MethodChannel'
            echo ''
            echo 'class MainActivity : FlutterActivity() {'
            echo '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {'
            echo '        super.configureFlutterEngine(flutterEngine)'
            echo '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "tele_cinema/device")'
            echo '            .setMethodCallHandler { call, result ->'
            echo '                if (call.method == "isTv") {'
            echo '                    val pm = packageManager'
            echo '                    result.success('
            echo '                        pm.hasSystemFeature(PackageManager.FEATURE_LEANBACK) ||'
            echo '                            pm.hasSystemFeature(PackageManager.FEATURE_TELEVISION)'
            echo '                    )'
            echo '                } else {'
            echo '                    result.notImplemented()'
            echo '                }'
            echo '            }'
            echo '    }'
            echo '}'
          } > "$MAIN_ACT"
          cat "$MAIN_ACT"

      - name: البناء
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons:main
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tele-cinema-apk
          path: build/app/outputs/flutter-apk/app-release.apk
